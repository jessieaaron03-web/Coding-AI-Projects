[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbench-ai"
version = "0.1.0"
description = "A reproducible evaluation lab for language models"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
dashboard = ["streamlit>=1.32", "pandas>=2.0"]

[project.scripts]
openbench = "openbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
